<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Agent BMO build status</title>
<desc id="dsc">Live: wallet address, public spec. In development: physical unit, on-device runtime. Planned: market observer, strategy and decision engines, risk engine, execution engine, position manager and memory, public activity feed, agent state on the display.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;}
.b{font-weight:700}
.blink{animation:blink 1.1s steps(1) infinite}
.blinkslow{animation:blink 2.4s steps(1) infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.blink,.blinkslow,.pulse{animation:none}}

</style><defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowsoft" x="-10%" y="-40%" width="120%" height="180%">
  <feGaussianBlur stdDeviation="1.1" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowbig" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".38"/>
</pattern>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
  <rect x="9.5" y="9.5" width="1" height="1" fill="#0b3a21"/>
</pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000" stop-opacity=".75"/>
</radialGradient>
<linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3dff8c" stop-opacity="0"/>
  <stop offset=".85" stop-color="#3dff8c" stop-opacity=".06"/>
  <stop offset="1" stop-color="#3dff8c" stop-opacity="0"/>
</linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#22b863"/>
</marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#ffb000"/>
</marker>
<marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#ff4d4d"/>
</marker>

</defs>
<rect width="880" height="312" rx="14" fill="#000000"/>
<rect width="880" height="312" rx="14" fill="url(#dots)"/>
<line x1="24" y1="40" x2="856" y2="40" stroke="#0b3a21"/>
<text x="24" y="30" font-size="11" fill="#22b863" letter-spacing="2">AGENT BMO / BUILD STATUS</text>
<text x="856" y="30" font-size="11" fill="#136b3a" text-anchor="end" letter-spacing="2">HONEST BY DEFAULT</text>
<rect x="40.0" y="58" width="253.33333333333334" height="222" fill="#020a06" stroke="#3dff8c"/><circle cx="60.0" cy="80" r="6" fill="#3dff8c" filter="url(#glow)" class=""/><text x="76.0" y="85" font-size="13" fill="#3dff8c" letter-spacing="3" font-weight="700">LIVE</text>
<line x1="54.0" y1="98" x2="279.33333333333337" y2="98" stroke="#0b3a21"/><text x="60.0" y="122" font-size="12" fill="#3dff8c">wallet address</text>
<text x="60.0" y="144" font-size="12" fill="#3dff8c">public spec and diagrams</text>
<rect x="313.33333333333337" y="58" width="253.33333333333334" height="222" fill="#020a06" stroke="#ffb000"/><circle cx="333.33333333333337" cy="80" r="6" fill="#ffb000" filter="url(#glow)" class="blinkslow"/><text x="349.33333333333337" y="85" font-size="13" fill="#ffb000" letter-spacing="3" font-weight="700">IN DEVELOPMENT</text>
<line x1="327.33333333333337" y1="98" x2="552.6666666666667" y2="98" stroke="#0b3a21"/><text x="333.33333333333337" y="122" font-size="12" fill="#3dff8c">physical unit</text>
<text x="343.33333333333337" y="144" font-size="10.5" fill="#136b3a">pi 5. printed shell. button pcb</text>
<text x="333.33333333333337" y="166" font-size="12" fill="#3dff8c">on-device runtime</text>
<text x="343.33333333333337" y="188" font-size="10.5" fill="#136b3a">wake word. local model. speech</text>
<rect x="586.6666666666667" y="58" width="253.33333333333334" height="222" fill="#020a06" stroke="#0b3a21"/><circle cx="606.6666666666667" cy="80" r="6" fill="none" stroke="#136b3a" stroke-width="1.5"/><text x="622.6666666666667" y="85" font-size="13" fill="#22b863" letter-spacing="3" font-weight="700">PLANNED</text>
<line x1="600.6666666666667" y1="98" x2="826.0000000000001" y2="98" stroke="#0b3a21"/><text x="606.6666666666667" y="122" font-size="12" fill="#22b863">market observer</text>
<text x="606.6666666666667" y="144" font-size="12" fill="#22b863">strategy + decision engines</text>
<text x="606.6666666666667" y="166" font-size="12" fill="#22b863">risk engine</text>
<text x="606.6666666666667" y="188" font-size="12" fill="#22b863">execution engine</text>
<text x="606.6666666666667" y="210" font-size="12" fill="#22b863">position manager + memory</text>
<text x="606.6666666666667" y="232" font-size="12" fill="#22b863">public activity feed</text>
<text x="606.6666666666667" y="254" font-size="12" fill="#22b863">agent state on display</text>
<text x="40" y="300" font-size="10" fill="#136b3a">this panel is updated by hand in the repo. it changes when the code does.</text>
<rect width="880" height="312" rx="14" fill="url(#scan)" pointer-events="none"/>
<rect width="880" height="312" rx="14" fill="url(#vig)" pointer-events="none"/>
<rect x="1" y="1" width="878" height="310" rx="13" fill="none" stroke="#136b3a" stroke-width="1.5"/>
</svg>
