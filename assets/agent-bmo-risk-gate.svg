<text x="24" y="30" font-size="11" fill="#22b863" letter-spacing="2">AGENT BMO / RISK GATE</text>
<text x="856" y="30" font-size="11" fill="#136b3a" text-anchor="end" letter-spacing="2">ALL GATES MUST PASS. ANY GATE CAN VETO</text>
<text x="40" y="76" font-size="10" fill="#136b3a" letter-spacing="3">INPUT</text>
<g><text x="110" y="76" font-size="13" fill="#3dff8c" letter-spacing="2" font-weight="700">CANDIDATE A</text>
<animate attributeName="opacity" values="1;0" keyTimes="0.00000;0.50000" dur="15.0s" calcMode="discrete" repeatCount="indefinite"/></g><g opacity="0"><text x="110" y="76" font-size="13" fill="#3dff8c" letter-spacing="2" font-weight="700">CANDIDATE B</text>
<animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.50000" dur="15.0s" calcMode="discrete" repeatCount="indefinite"/></g><text x="840" y="76" font-size="10.5" fill="#136b3a" text-anchor="end">illustration. no real orders. limits not yet set</text>
