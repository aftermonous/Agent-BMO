<rect x="40" y="86" width="800" height="2" fill="#3dff8c" opacity=".35"><animate attributeName="y" values="86;250;86" dur="6s" repeatCount="indefinite"/></rect>
<rect x="205.0" y="138" width="470" height="66" fill="#000000" stroke="#ffb000" stroke-width="1.5"/><rect x="209.0" y="142" width="462" height="58" fill="none" stroke="#6b4a00"/><text x="440.0" y="170" font-size="17" fill="#ffb000" text-anchor="middle" letter-spacing="3" font-weight="700" filter="url(#glow)">AWAITING FIRST LIVE EXECUTION</text>
<rect x="612.0" y="156" width="9" height="17" fill="#ffb000" class="blink"/><text x="440.0" y="190" font-size="11" fill="#22b863" text-anchor="middle">no trades yet. nothing here will be invented.</text>
<line x1="40" y1="270" x2="840" y2="270" stroke="#136b3a"/><text x="40" y="286" font-size="10" fill="#136b3a" letter-spacing="2">ENTRIES</text>
