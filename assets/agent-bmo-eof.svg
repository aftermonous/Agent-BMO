<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120" role="img" aria-labelledby="ttl dsc">
<title id="ttl">End of transmission</title>
<desc id="dsc">End of transmission. Agent BMO is in standby.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;}
.b{font-weight:700}
.blink{animation:blink 1.1s steps(1) infinite}
.blinkslow{animation:blink 2.4s steps(1) infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.blink,.blinkslow,.pulse{animation:none}}

</style><defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowsoft" x="-10%" y="-40%" width="120%" height="180%">
  <feGaussianBlur stdDeviation="1.1" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowbig" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity=".38"/>
</pattern>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
  <rect x="9.5" y="9.5" width="1" height="1" fill="#0b3a21"/>
</pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000" stop-opacity=".75"/>
</radialGradient>
<linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3dff8c" stop-opacity="0"/>
  <stop offset=".85" stop-color="#3dff8c" stop-opacity=".06"/>
  <stop offset="1" stop-color="#3dff8c" stop-opacity="0"/>
</linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#22b863"/>
</marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#ffb000"/>
</marker>
<marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#ff4d4d"/>
</marker>

</defs>
<rect width="880" height="120" rx="14" fill="#000000"/>
<rect width="880" height="120" rx="14" fill="url(#dots)"/>
<text x="40" y="50" font-size="11" fill="#136b3a" letter-spacing="4">EOF</text>
<text x="40" y="80" font-size="14" fill="#22b863">bmo@unit01:~$ agent status</text>
<text x="275.20000000000005" y="80" font-size="14" fill="#ffb000">standby. waiting for limits. waiting for release.</text>
<rect x="695" y="68" width="9" height="16" fill="#ffb000" class="blink"/><text x="840" y="50" font-size="10" fill="#136b3a" text-anchor="end" letter-spacing="1">bmoPFnjLBAFq6Gqau8RE4PNMAzYLw6GT5cNBudnJEmf</text>
<rect width="880" height="120" rx="14" fill="url(#scan)" pointer-events="none"/>
<rect width="880" height="120" rx="14" fill="url(#vig)" pointer-events="none"/>
<rect x="1" y="1" width="878" height="118" rx="13" fill="none" stroke="#136b3a" stroke-width="1.5"/>
</svg>
